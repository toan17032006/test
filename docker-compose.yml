version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: vulnshop_postgres
    environment:
      POSTGRES_DB: vulnshop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init_postgres.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always

  mysql:
    image: mysql:8.0
    container_name: vulnshop_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: vulnshop_legacy
      MYSQL_USER: mysql_user
      MYSQL_PASSWORD: mysql_pass
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/db/init_mysql.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always

  mongodb:
    image: mongo:7
    container_name: vulnshop_mongo
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./backend/db/init_mongo.js:/docker-entrypoint-initdb.d/init.js
    restart: always

  redis:
    image: redis:7
    container_name: vulnshop_redis
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --loglevel verbose
    restart: always

  elasticsearch:
    image: elasticsearch:8.11.0
    container_name: vulnshop_elastic
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9200:9200"
      - "127.0.0.1:9300:9300"
    volumes:
      - elastic_data:/usr/share/elasticsearch/data
    restart: always

  neo4j:
    image: neo4j:5
    container_name: vulnshop_neo4j
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j_data:/data
    restart: always

  influxdb:
    image: influxdb:2.7
    container_name: vulnshop_influx
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: admin123
      DOCKER_INFLUXDB_INIT_ORG: vulnshop
      DOCKER_INFLUXDB_INIT_BUCKET: metrics
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: vulnshop-super-secret-token
    ports:
      - "127.0.0.1:8086:8086"
    volumes:
      - influx_data:/var/lib/influxdb2
    restart: always

  mailhog:
    image: mailhog/mailhog
    container_name: vulnshop_mailhog
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    restart: always

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vulnshop_api
    environment:
      DATABASE_URL: postgresql://postgres:postgres123@postgres:5432/vulnshop
      MYSQL_URL: mysql+pymysql://mysql_user:mysql_pass@mysql:3306/vulnshop_legacy
      MONGODB_URL: mongodb://mongodb:27017/vulnshop
      REDIS_URL: redis://redis:6379/0
      ELASTICSEARCH_URL: http://elasticsearch:9200
      NEO4J_URL: bolt://neo4j:7687
      SECRET_KEY: super-secret-key-12345
      JWT_SECRET: jwt-secret-weak
      ADMIN_PASSWORD: admin123
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_USER: ""
      SMTP_PASS: ""
      DEBUG: "true"
      FLASK_ENV: development
      PYTHONDONTWRITEBYTECODE: 1
      AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
      AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
    depends_on:
      - postgres
      - mongodb
      - redis
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vulnshop_frontend
    environment:
      API_URL: http://api:8000
      GRAPHQL_URL: http://graphql:4000/graphql
      NODE_ENV: development
      SESSION_SECRET: session-secret-weak
      HOST: "0.0.0.0"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api
    restart: always

  graphql:
    build:
      context: ./services/graphql
      dockerfile: Dockerfile
    container_name: vulnshop_graphql
    environment:
      API_URL: http://api:8000
      DATABASE_URL: postgresql://postgres:postgres123@postgres:5432/vulnshop
      MONGODB_URL: mongodb://mongodb:27017/vulnshop
      INTROSPECTION: "true"
      DEBUG: "true"
      HOST: "0.0.0.0"
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./services/graphql:/app
      - /app/node_modules
    depends_on:
      - api
      - postgres
      - mongodb
    restart: always

  worker:
    build:
      context: ./services/worker
      dockerfile: Dockerfile
    container_name: vulnshop_worker
    environment:
      DATABASE_URL: postgresql://postgres:postgres123@postgres:5432/vulnshop
      REDIS_URL: redis://redis:6379/0
      MONGODB_URL: mongodb://mongodb:27017/vulnshop
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
    volumes:
      - ./services/worker:/app
      - ./uploads:/app/uploads
    depends_on:
      - redis
      - postgres
    restart: always

  nginx:
    image: nginx:alpine
    container_name: vulnshop_nginx
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - frontend
      - api
      - graphql
    restart: always

networks:
  default:
    internal: true

volumes:
  postgres_data:
  mysql_data:
  mongo_data:
  elastic_data:
  neo4j_data:
  influx_data:
