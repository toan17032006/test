name: lab-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install storefront dependencies
        run: npm ci
        working-directory: frontend

      - name: Render storefront views
        run: npm test
        working-directory: frontend

      - name: Install GraphQL dependencies
        run: npm ci
        working-directory: services/graphql

      - name: Check GraphQL JavaScript syntax
        run: for file in src/*.js; do node --check "$file"; done
        working-directory: services/graphql

      - name: Install API dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run inventory and API unit checks
        run: python -m unittest discover -s tests -v
